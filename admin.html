<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>관리 · 최인용</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-head">
    <div class="wrap">
      <a class="brand" href="./"><b>최인용</b><span>서울교육대학교 수학교육과</span></a>
      <nav class="nav">
        <a href="./">소개</a>
        <a href="apps.html">수업용 앱</a>
        <a href="research.html">연구</a>
      </nav>
    </div>
  </header>
  <main class="wrap" style="padding-top:64px">
    <span class="eyebrow">Admin</span>
    <h1 style="font-size:30px;margin-top:14px">관리 모드</h1>
    <p style="color:var(--ink-2);max-width:620px">관리는 각 페이지에서 바로 합니다. 오른쪽 위 <b>관리</b> 버튼을 누르면 앱 카드와 논문마다 수정·삭제 버튼이 나타나고,
      연구 페이지에는 KCI 주소로 논문을 추가하는 칸이 생깁니다.</p>
    <p><button class="btn" id="go">관리 모드 켜기</button> <a class="btn ghost" href="apps.html">수업용 앱으로</a></p>
  </main>
  <script src="assets/js/common.js"></script>
  <script>
    $("#go").addEventListener("click", async () => {
      await window.adminReady;
      if (window.Admin?.on) return (location.href = "apps.html");
      if (!window.Admin) await loadScript("assets/js/admin-inline.js");
      sessionStorage.setItem("hp-admin-next", "apps.html");
      window.Admin.enter();
    });
    window.adminReady.then((on) => { if (on && sessionStorage.getItem("hp-admin-next")) { const n = sessionStorage.getItem("hp-admin-next"); sessionStorage.removeItem("hp-admin-next"); location.href = n; } });
  </script>
</body>
</html>
