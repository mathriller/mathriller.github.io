<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L-System 프랙탈 생성기</title>
    <meta name="description" content="L-System 규칙 기반 프랙탈 도형을 실시간으로 생성하고 시각화하는 웹 앱">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #f4f5f9;
            --bg-secondary: #ffffff;
            --bg-tertiary: #ebedf5;
            --bg-input: #f7f8fc;
            --text-primary: #1e1e2e;
            --text-secondary: #555570;
            --text-muted: #8888a8;
            --accent: #6c4de6;
            --accent-hover: #8268f0;
            --accent-glow: rgba(108, 77, 230, 0.18);
            --border: #d8dbe8;
            --border-focus: #6c4de6;
            --canvas-bg: #ffffff;
            --radius: 14px;
            --radius-sm: 10px;
            --transition: 0.2s ease;
            --font-ui: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'Consolas', monospace;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.07);
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: var(--font-ui);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem;
            gap: 1.5rem;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, #6c4de6 0%, #a78bfa 50%, #e879a8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .app-container {
            width: 100%;
            max-width: 1180px;
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) minmax(340px, 0.85fr);
            align-items: start;
            gap: 1.1rem;
        }

        /* ---- Canvas ---- */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            min-height: 420px;
            background: var(--canvas-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .canvas-wrapper { grid-column: 1; grid-row: 1 / span 3; }

        .canvas-wrapper.is-panning canvas { cursor: grabbing; }

        .canvas-wrapper canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
            touch-action: none;
        }

        .canvas-actions { position: absolute; top: 0.8rem; right: 0.8rem; z-index: 1; }
        .zoom-controls { position:absolute; right:.8rem; bottom:.8rem; z-index:1; display:flex; gap:.4rem; padding:.35rem; border:1px solid var(--border); border-radius:12px; background:rgba(255,255,255,.94); box-shadow:var(--shadow-sm); }
        .zoom-controls button { min-width:2.5rem; padding:.45rem .65rem; color:var(--text-secondary); background:transparent; font-size:1rem; }
        .zoom-controls button:hover { color:var(--accent); background:var(--bg-tertiary); }
        .zoom-controls .zoom-reset { min-width:4.2rem; font-size:.78rem; }
        .btn-ghost { padding: 0.55rem 0.8rem; color: var(--text-secondary); background: rgba(255,255,255,.92); border: 1px solid var(--border); box-shadow: var(--shadow-sm); font-size: .82rem; }
        .btn-ghost:hover { color: var(--accent); border-color: var(--accent); }
        .app-container > .panel:nth-child(2) { grid-column: 2; grid-row: 1; }
        .app-container > .panel:nth-child(3) { grid-column: 2; grid-row: 2; }
        .app-container > .panel:nth-child(4) { grid-column: 2; grid-row: 3; }
        .color-field { display: flex; align-items: center; gap: .5rem; }
        input[type="color"] { width: 100%; height: 40px; padding: 3px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-input); cursor: pointer; }
        select { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: .65rem .75rem; color: var(--text-primary); background: var(--bg-input); font: inherit; }
        .palette-controls { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.65rem; }
        .palette-controls small { grid-column:1/-1; color:var(--text-muted); font-size:.76rem; line-height:1.5; }
        [hidden] { display:none !important; }
        .check-row { display:flex; align-items:center; gap:.55rem; font-size:.85rem; color:var(--text-secondary); }
        .check-row input { accent-color: var(--accent); width:1rem; height:1rem; }
        .status { min-height: 1.2em; font-size: .8rem; color: #b45309; }
        .panel { min-width:0; }

        /* ---- Panels ---- */
        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: var(--shadow-sm);
        }

        .panel-title {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .panel-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 14px;
            background: var(--accent);
            border-radius: 2px;
        }

        /* ---- Form Elements ---- */
        label {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        label {
            overflow: hidden;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.65rem 0.85rem;
            outline: none;
            width: 100%;
            min-width: 0;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        input:focus,
        textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        textarea {
            resize: vertical;
            min-height: 3.5rem;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            opacity: 1;
        }

        /* ---- Grid layouts ---- */
        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
        }

        .row-4 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.85rem;
        }

        /* ---- Slider ---- */
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .slider-value {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--bg-tertiary);
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 2px 8px var(--accent-glow);
            transition: transform var(--transition);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            cursor: pointer;
        }

        /* ---- Buttons ---- */
        .btn-row {
            display: flex;
            gap: 0.75rem;
        }

        button {
            font-family: var(--font-ui);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: var(--radius-sm);
            padding: 0.75rem 1.5rem;
            transition: all var(--transition);
        }

        .btn-primary {
            flex: 1;
            background: linear-gradient(135deg, #6c4de6 0%, #9b7fff 100%);
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px var(--accent-glow);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* ---- String output ---- */
        .string-output {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            line-height: 1.5;
            background: var(--bg-input);
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.75rem 1rem;
            max-height: 7rem;
            overflow-y: auto;
            word-break: break-all;
            white-space: pre-wrap;
        }

        .string-output.too-long {
            color: var(--text-muted);
            font-style: italic;
        }

        /* ---- Stats ---- */
        .stats {
            display: flex;
            gap: 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            flex-wrap: wrap;
        }

        /* ---- Ensure inputs never overflow ---- */
        input,
        textarea {
            max-width: 100%;
            min-width: 0;
        }

        /* ---- Responsive ---- */
        @media (min-width: 700px) { .row-4 { grid-template-columns: 1fr 1fr 1fr 1fr; } }

        @media (max-width: 900px) {
            .app-container { grid-template-columns: minmax(0, 1fr); }
            .canvas-wrapper, .app-container > .panel:nth-child(2), .app-container > .panel:nth-child(3), .app-container > .panel:nth-child(4) { grid-column: 1; grid-row: auto; }
            .canvas-wrapper { min-height: 0; }
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem 0.6rem;
                gap: 0.85rem;
            }

            h1 {
                font-size: 1.25rem;
            }

            .panel {
                padding: 0.85rem;
                gap: 0.75rem;
                border-radius: 10px;
            }

            .row-3 {
                grid-template-columns: 1fr 1fr;
                gap: 0.6rem;
            }

            .row-4 {
                grid-template-columns: 1fr 1fr;
                gap: 0.6rem;
            }

            button {
                padding: 0.65rem 1rem;
                font-size: 0.9rem;
            }

            .canvas-wrapper {
                border-radius: 10px;
            }

            label {
                font-size: 0.8rem;
            }

            input[type="text"],
            input[type="number"],
            textarea {
                font-size: 0.85rem;
                padding: 0.55rem 0.7rem;
            }
        }

        /* scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 3px;
        }
    </style>
</head>

<body>

    <h1>🌿 L-System 프랙탈 생성기</h1>

    <div class="app-container">

        <!-- Canvas -->
        <div class="canvas-wrapper">
            <canvas id="fractalCanvas" aria-label="L-System 프랙탈 미리보기"></canvas>
            <div class="canvas-actions"><button class="btn-ghost" id="downloadBtn" type="button">PNG 저장</button></div>
            <div class="zoom-controls" aria-label="캔버스 확대 축소"><button id="zoomOut" type="button" aria-label="축소">−</button><button class="zoom-reset" id="zoomReset" type="button">맞춤</button><button id="zoomIn" type="button" aria-label="확대">+</button></div>
        </div>

        <!-- Axiom & Rules -->
        <div class="panel">
            <div class="panel-title">L-System 정의</div>
            <label>
                초기 문자열 (Axiom)
                <input type="text" id="axiomInput" value="F" spellcheck="false">
            </label>
            <label>
                규칙 (Rules) — 줄마다 하나씩, 예: F=+F--F+
                <textarea id="rulesInput" rows="3" spellcheck="false">F=F+F--F+F</textarea>
            </label>
            <div class="btn-row">
                <button class="btn-primary" id="executeBtn">▶ 실행</button>
            </div>
        </div>

        <!-- Parameters -->
        <div class="panel">
            <div class="panel-title">파라미터</div>
            <div class="row-4">
                <label>
                    초기 각도 (°)
                    <input type="number" id="startAngle" value="0" step="1">
                </label>
                <label>
                    회전 각도 (°)
                    <input type="number" id="turnAngle" value="60" step="1">
                </label>
                <label>
                    선 굵기 (px)
                    <input type="number" id="lineWidth" value="1" min="0.5" max="20" step="0.5">
                </label>
                <label>선 색상 모드
                    <select id="colorMode"><option value="solid">단색</option><option value="gradient">그라데이션</option><option value="symbols">기호별 (A–D)</option></select>
                </label>
                <label>선 색상
                    <input type="color" id="lineColor" value="#222222">
                </label>
                <label id="endColorLabel" hidden>끝 색상
                    <input type="color" id="endColor" value="#8b5cf6">
                </label>
                <label>배경 색상
                    <input type="color" id="backgroundColor" value="#ffffff">
                </label>
            </div>
            <div class="palette-controls" id="paletteControls" hidden>
                <label>A 색상<input type="color" id="symbolColorA" value="#2f855a"></label>
                <label>B 색상<input type="color" id="symbolColorB" value="#3182ce"></label>
                <label>C 색상<input type="color" id="symbolColorC" value="#dd6b20"></label>
                <label>D 색상<input type="color" id="symbolColorD" value="#805ad5"></label>
                <small>A–D를 만나면 해당 색으로 바뀝니다. 대괄호 가지 안에서 바꾼 색은 가지를 빠져나오면 복원됩니다.</small>
            </div>
            <label class="check-row"><input type="checkbox" id="taperToggle"> 가지 깊이에 따라 선을 가늘게</label>
            <div class="slider-group">
                <div class="slider-header">
                    <span>단계 (Generation)</span>
                    <span class="slider-value" id="genValue">10</span>
                </div>
                <input type="range" id="genSlider" min="0" max="12" value="3">
            </div>
        </div>

        <!-- Current String -->
        <div class="panel">
            <div class="panel-title">현재 문자열</div>
            <div class="stats" id="statsRow"></div>
            <div class="status" id="statusMessage" role="status" aria-live="polite"></div>
            <div class="string-output" id="stringOutput"></div>
        </div>

    </div>

    <script>
        // ===== L-System Engine =====
        const MAX_STRING_LENGTH = 1_200_000;
        let zoomLevel = 1, panX = 0, panY = 0;
        class LSystem {
            constructor(axiom, rulesText) {
                this.axiom = axiom.toUpperCase();
                this.rules = Object.create(null);
                for (const line of rulesText.split(/\r?\n/)) {
                    const eq = line.indexOf('=');
                    if (eq < 1) continue;
                    const key = line.slice(0, eq).trim().toUpperCase();
                    if ([...key].length === 1) this.rules[key] = line.slice(eq + 1).trim().toUpperCase();
                }
            }
            generate(generations) {
                let current = this.axiom;
                for (let i = 0; i < generations; i++) {
                    // Predict the next size before allocating it. Native replace performs one parallel rewrite pass.
                    let projected = current.length;
                    const counts = Object.create(null);
                    for (const ch of current) if (this.rules[ch] !== undefined) counts[ch] = (counts[ch] || 0) + 1;
                    for (const [symbol, count] of Object.entries(counts)) projected += count * (this.rules[symbol].length - 1);
                    if (projected > MAX_STRING_LENGTH) throw new RangeError(`생성 결과가 제한(${MAX_STRING_LENGTH.toLocaleString()}자)을 넘습니다. 단계 수를 낮춰 주세요.`);
                    current = current.replace(/[A-Z]/g, ch => this.rules[ch] ?? ch);
                }
                return current;
            }
        }

        function turtleCompute(str, startAngleDeg, turnAngleDeg) {
            const toRad = Math.PI / 180;
            let drawCount = 0;
            for (const ch of str) if (ch === 'F' || ch === 'G') drawCount++;
            const segments = new Float64Array(drawCount * 4);
            const depths = new Uint16Array(drawCount), colors = new Uint8Array(drawCount);
            let count = 0, x = 0, y = 0, angle = startAngleDeg * toRad, colorIndex = 0;
            const turn = turnAngleDeg * toRad, stack = [];
            let minX = 0, minY = 0, maxX = 0, maxY = 0, maxDepth = 0;
            for (const ch of str) {
                if (ch === 'F' || ch === 'G') {
                    const nx = x + Math.cos(angle), ny = y + Math.sin(angle), i = count * 4;
                    segments[i] = x; segments[i + 1] = y; segments[i + 2] = nx; segments[i + 3] = ny;
                    depths[count] = stack.length; colors[count++] = colorIndex; maxDepth = Math.max(maxDepth, stack.length);
                    x = nx; y = ny;
                    minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y);
                } else if (ch === '+') angle += turn;
                else if (ch === '-') angle -= turn;
                else if (ch === '|') angle += Math.PI;
                else if (ch === '[') stack.push(x, y, angle, colorIndex);
                else if (ch === ']' && stack.length >= 4) { colorIndex = stack.pop(); angle = stack.pop(); y = stack.pop(); x = stack.pop(); }
                else if (colorModeInput.value === 'symbols' && ch >= 'A' && ch <= 'D') colorIndex = ch.charCodeAt(0) - 64;
            }
            return { segments, depths, colors, count, maxDepth, minX, minY, maxX, maxY };
        }

        function renderFractal(canvas, result) {
            const ctx = canvas.getContext('2d');
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const displayW = canvas.clientWidth, displayH = canvas.clientHeight;
            canvas.width = Math.round(displayW * dpr); canvas.height = Math.round(displayH * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.fillStyle = backgroundColorInput.value; ctx.fillRect(0, 0, displayW, displayH);
            if (!result.count) {
                ctx.fillStyle = '#999'; ctx.font = '16px Inter, sans-serif'; ctx.textAlign = 'center';
                ctx.fillText('실행 버튼을 눌러 프랙탈을 생성하세요', displayW / 2, displayH / 2); return;
            }
            const { minX, minY, maxX, maxY } = result;
            const fracW = maxX - minX, fracH = maxY - minY, padding = 30;
            const availW = Math.max(1, displayW - padding * 2), availH = Math.max(1, displayH - padding * 2);
            const scale = Math.min(fracW ? availW / fracW : Infinity, fracH ? availH / fracH : Infinity);
            const fitScale = Number.isFinite(scale) ? scale : 1;
            const safeScale = fitScale * zoomLevel;
            const baseOx = padding + (availW - fracW * fitScale) / 2 - minX * fitScale;
            const baseOy = padding + (availH - fracH * fitScale) / 2 - minY * fitScale;
            const ox = displayW / 2 + (baseOx - displayW / 2) * zoomLevel + panX;
            const oy = displayH / 2 + (baseOy - displayH / 2) * zoomLevel + panY;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            const mode = colorModeInput.value;
            const palette = [lineColorInput.value, ...paletteInputs.map(input => input.value)];
            let gradient = null;
            if (mode === 'gradient') {
                gradient = ctx.createLinearGradient(padding, padding, displayW - padding, displayH - padding);
                gradient.addColorStop(0, lineColorInput.value); gradient.addColorStop(1, endColorInput.value);
            }
            const baseWidth = Math.max(0.25, Math.min(40, Number(lineWidthInput.value) || 1));
            const colorGroups = mode === 'symbols' ? palette.length : 1;
            for (let colorGroup = 0; colorGroup < colorGroups; colorGroup++) {
                ctx.strokeStyle = mode === 'gradient' ? gradient : (mode === 'symbols' ? palette[colorGroup] : lineColorInput.value);
                const depthGroups = taperToggle.checked ? Array.from({ length: result.maxDepth + 1 }, () => []) : null;
                if (depthGroups) {
                    for (let n = 0; n < result.count; n++) {
                        if (mode !== 'symbols' || result.colors[n] === colorGroup) depthGroups[result.depths[n]].push(n);
                    }
                } else {
                    ctx.lineWidth = baseWidth; ctx.beginPath();
                    for (let n = 0; n < result.count; n++) {
                        if (mode === 'symbols' && result.colors[n] !== colorGroup) continue;
                        const i = n * 4, a = result.segments;
                        ctx.moveTo(a[i] * safeScale + ox, a[i + 1] * safeScale + oy);
                        ctx.lineTo(a[i + 2] * safeScale + ox, a[i + 3] * safeScale + oy);
                    }
                    ctx.stroke();
                }
                if (depthGroups) for (let depth = 0; depth < depthGroups.length; depth++) {
                    const ids = depthGroups[depth]; if (!ids.length) continue;
                    ctx.lineWidth = Math.max(0.25, baseWidth * (1 - 0.78 * depth / Math.max(1, result.maxDepth)));
                    ctx.beginPath();
                    for (const n of ids) {
                        const i = n * 4, a = result.segments;
                        ctx.moveTo(a[i] * safeScale + ox, a[i + 1] * safeScale + oy);
                        ctx.lineTo(a[i + 2] * safeScale + ox, a[i + 3] * safeScale + oy);
                    }
                    ctx.stroke();
                }
            }
        }

        const canvas = document.getElementById('fractalCanvas');
        const axiomInput = document.getElementById('axiomInput'), rulesInput = document.getElementById('rulesInput');
        const startAngleInput = document.getElementById('startAngle'), turnAngleInput = document.getElementById('turnAngle');
        const genSlider = document.getElementById('genSlider'), genValue = document.getElementById('genValue');
        const executeBtn = document.getElementById('executeBtn'), stringOutput = document.getElementById('stringOutput');
        const statsRow = document.getElementById('statsRow'), statusMessage = document.getElementById('statusMessage');
        const lineColorInput = document.getElementById('lineColor'), lineWidthInput = document.getElementById('lineWidth');
        const colorModeInput = document.getElementById('colorMode'), endColorInput = document.getElementById('endColor');
        const backgroundColorInput = document.getElementById('backgroundColor'), taperToggle = document.getElementById('taperToggle');
        const endColorLabel = document.getElementById('endColorLabel');
        const paletteControls = document.getElementById('paletteControls');
        const paletteInputs = ['symbolColorA', 'symbolColorB', 'symbolColorC', 'symbolColorD'].map(id => document.getElementById(id));
        let lsystem = null, generatedString = '', lastResult = null, busy = false;

        function updateStringDisplay() {
            const maxDisplay = 8000;
            stringOutput.textContent = generatedString.length > maxDisplay
                ? generatedString.slice(0, maxDisplay) + `… (총 ${generatedString.length.toLocaleString()}자)` : generatedString;
            stringOutput.classList.toggle('too-long', generatedString.length > maxDisplay);
            let segmentCount = 0; for (const ch of generatedString) if (ch === 'F' || ch === 'G') segmentCount++;
            statsRow.innerHTML = `<span>문자열 <strong>${generatedString.length.toLocaleString()}</strong></span><span>선분 <strong>${segmentCount.toLocaleString()}</strong></span><span>단계 <strong>${genSlider.value}</strong></span>`;
        }
        function regenerateAndDraw() {
            if (!lsystem || busy) return;
            busy = true; executeBtn.disabled = true; statusMessage.textContent = '';
            requestAnimationFrame(() => {
                try {
                    generatedString = lsystem.generate(Number(genSlider.value));
                    lastResult = turtleCompute(generatedString, Number(startAngleInput.value) || 0, Number(turnAngleInput.value) || 90);
                    updateStringDisplay(); renderFractal(canvas, lastResult);
                } catch (error) {
                    statusMessage.textContent = error instanceof RangeError ? error.message : '프랙탈 생성 중 오류가 발생했습니다.';
                } finally { busy = false; executeBtn.disabled = false; }
            });
        }
        function execute() {
            lsystem = new LSystem(axiomInput.value.trim() || 'F', rulesInput.value);
            regenerateAndDraw();
        }
        function redraw() { if (lastResult) renderFractal(canvas, lastResult); }
        function updateGeometry() {
            if (!generatedString) return;
            lastResult = turtleCompute(generatedString, Number(startAngleInput.value) || 0, Number(turnAngleInput.value) || 90);
            redraw();
        }

        executeBtn.addEventListener('click', execute);
        axiomInput.addEventListener('blur', execute); rulesInput.addEventListener('blur', execute);
        genSlider.addEventListener('input', () => { genValue.textContent = genSlider.value; regenerateAndDraw(); });
        [startAngleInput, turnAngleInput].forEach(input => input.addEventListener('input', updateGeometry));
        [lineColorInput, endColorInput, lineWidthInput, backgroundColorInput, taperToggle].forEach(input => input.addEventListener('input', redraw));
        colorModeInput.addEventListener('change', () => {
            endColorLabel.hidden = colorModeInput.value !== 'gradient';
            paletteControls.hidden = colorModeInput.value !== 'symbols';
            updateGeometry();
        });
        paletteInputs.forEach(input => input.addEventListener('input', redraw));
        function setZoom(value, anchorX = canvas.clientWidth / 2, anchorY = canvas.clientHeight / 2) {
            const nextZoom = Math.max(0.25, Math.min(8, value));
            const centerX = canvas.clientWidth / 2, centerY = canvas.clientHeight / 2;
            const worldX = (anchorX - centerX - panX) / zoomLevel;
            const worldY = (anchorY - centerY - panY) / zoomLevel;
            panX = anchorX - centerX - worldX * nextZoom;
            panY = anchorY - centerY - worldY * nextZoom;
            zoomLevel = nextZoom;
            document.getElementById('zoomReset').textContent = `${Math.round(zoomLevel * 100)}%`;
            redraw();
        }
        document.getElementById('zoomIn').addEventListener('click', () => setZoom(zoomLevel * 1.2));
        document.getElementById('zoomOut').addEventListener('click', () => setZoom(zoomLevel / 1.2));
        document.getElementById('zoomReset').addEventListener('click', () => {
            zoomLevel = 1; panX = 0; panY = 0;
            document.getElementById('zoomReset').textContent = '맞춤'; redraw();
        });
        document.querySelector('.canvas-wrapper').addEventListener('wheel', event => {
            event.preventDefault();
            const rect = canvas.getBoundingClientRect();
            setZoom(zoomLevel * Math.exp(-event.deltaY * 0.0015), event.clientX - rect.left, event.clientY - rect.top);
        }, { passive: false });

        let dragPointerId = null, dragX = 0, dragY = 0;
        canvas.addEventListener('pointerdown', event => {
            if (event.button !== 0) return;
            dragPointerId = event.pointerId; dragX = event.clientX; dragY = event.clientY;
            canvas.setPointerCapture(event.pointerId);
            canvas.closest('.canvas-wrapper').classList.add('is-panning');
            event.preventDefault();
        });
        canvas.addEventListener('pointermove', event => {
            if (event.pointerId !== dragPointerId) return;
            panX += event.clientX - dragX; panY += event.clientY - dragY;
            dragX = event.clientX; dragY = event.clientY; redraw();
        });
        function finishPan(event) {
            if (event.pointerId !== dragPointerId) return;
            dragPointerId = null; canvas.closest('.canvas-wrapper').classList.remove('is-panning');
        }
        canvas.addEventListener('pointerup', finishPan);
        canvas.addEventListener('pointercancel', finishPan);
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const link = document.createElement('a'); link.download = 'l-system-fractal.png'; link.href = canvas.toDataURL('image/png'); link.click();
        });
        window.addEventListener('resize', () => { clearTimeout(window.__fractalResize); window.__fractalResize = setTimeout(redraw, 100); });
        genValue.textContent = genSlider.value; execute();
    </script>
</body>

</html>
