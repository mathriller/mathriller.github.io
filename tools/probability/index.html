<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정사면체 주사위 시뮬레이션 (4면체)</title>
    <style>
        * {
            box-sizing: border-box;
            /* 모든 요소에 box-sizing 적용 */
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            display: flex;
            flex-direction: row;
            /* 가로 배치: 왼쪽 3D, 오른쪽 결과 패널 */
        }

        /* 모바일 반응형 스타일 */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                align-items: stretch;
                /* 자식 요소 가로 꽉 채우기 */
            }

            #main-content {
                height: 50% !important;
                /* vh 대신 % 사용 */
                flex: 0 0 50%;
                width: 100% !important;
            }

            #results-panel {
                width: 100% !important;
                /* 강제 적용 */
                height: 50% !important;
                /* vh 대신 % 사용 */
                flex: 0 0 50%;
                border-left: none;
                border-top: 1px solid #ccc;

                /* Grid Layout for Side-by-Side on Mobile */
                display: grid !important;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto 1fr auto;
                overflow: hidden;
            }

            /* H2 Headers */
            #results-panel>h2:nth-of-type(1) {
                grid-column: 1;
                grid-row: 1;
                font-size: 1em;
                padding: 8px;
                margin: 0;
                background-color: #f7f7f7;
                border-bottom: 1px solid #ddd;
                text-align: center;
            }

            #results-panel>h2:nth-of-type(2) {
                grid-column: 2;
                grid-row: 1;
                font-size: 1em;
                padding: 8px;
                margin: 0;
                background-color: #f7f7f7;
                border-bottom: 1px solid #ddd;
                border-left: 1px solid #ddd;
                text-align: center;
            }

            /* Content Areas */
            #history-log {
                grid-column: 1;
                grid-row: 2;
                overflow-y: auto;
                border-right: 1px solid #ddd;
                background-color: #fff;
                width: 100%;
            }

            #summary-table {
                grid-column: 2;
                grid-row: 2;
                overflow-y: auto;
                padding: 0 !important;
                background-color: #fff;
                width: 100%;
            }

            /* Reset Controls */
            #reset-controls {
                grid-column: 1 / -1;
                grid-row: 3;
                padding: 8px !important;
                width: 100%;
            }

            /* Other mobile adjustments */
            #controls {
                padding: 10px;
                width: 100%;
            }

            #throwButton,
            #throw100Button {
                font-size: 0.9em;
                padding: 8px 12px;
                margin-right: 5px;
            }

            #resultDisplay {
                font-size: 1.1em;
                margin-top: 5px;
            }

            /* Table padding reduction */
            th,
            td {
                padding: 4px 6px !important;
                font-size: 0.85em !important;
            }
        }

        /* 메인 컨텐츠 영역 (캔버스 + 하단 컨트롤) */
        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            /* 내부 스크롤 방지 */
        }

        /* 3D 캔버스가 들어갈 컨테이너 */
        #container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            min-height: 0;
            /* Flexbox 자식의 최소 높이 문제 해결 */
            background-color: #eeeeff;
            /* 캔버스 로드 전 배경색 */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 하단 컨트롤 영역 */
        #controls {
            flex-shrink: 0;
            text-align: center;
            padding: 20px;
            background-color: #ffffff;
            border-top: 1px solid #ccc;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }

        #throwButton {
            font-size: 1.2em;
            padding: 10px 20px;
            margin-right: 10px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        #throwButton:hover {
            background-color: #0056b3;
        }

        #throwButton:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        /* 100번 던지기 버튼 */
        #throw100Button {
            font-size: 1.2em;
            padding: 10px 20px;
            margin-right: 20px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        #throw100Button:hover {
            background-color: #218838;
        }

        #throw100Button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        #resultDisplay {
            font-size: 1.5em;
            font-weight: bold;
            display: inline-block;
            min-width: 200px;
            text-align: left;
        }

        /* 오른쪽 결과 패널 */
        #results-panel {
            flex-shrink: 0;
            width: 250px;
            background-color: #ffffff;
            border-left: 1px solid #ccc;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #results-panel h2 {
            font-size: 1.2em;
            padding: 10px 15px;
            margin: 0;
            background-color: #f7f7f7;
            border-bottom: 1px solid #ddd;
            color: #333;
        }

        /* 결과 기록 테이블 영역 */
        #history-log {
            flex-grow: 1;
            overflow-y: auto;
            background-color: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        #history-table th,
        #history-table td,
        #summary-table-data th,
        #summary-table-data td {
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
            font-size: 0.9em;
        }

        #history-table th,
        #summary-table-data th {
            background-color: #f9f9f9;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        #history-table th:first-child,
        #history-table td:first-child {
            width: 70px;
            text-align: center;
        }

        #history-table td:last-child {
            text-align: right;
        }

        /* 누적 빈도 테이블 영역 */
        #summary-table {
            flex-shrink: 0;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        #summary-table-data th:first-child,
        #summary-table-data td:first-child {
            width: 60px;
            text-align: center;
        }

        #summary-table-data td:nth-child(2) {
            text-align: right;
        }

        #summary-table-data tfoot th,
        #summary-table-data tfoot td {
            background-color: #f0f0f0;
            font-weight: bold;
            border-top: 2px solid #ddd;
        }

        #summary-table-data tfoot td {
            text-align: right;
        }

        /* 초기화 버튼 영역 */
        #reset-controls {
            flex-shrink: 0;
            padding: 15px;
            border-top: 1px solid #ddd;
            background-color: #f7f7f7;
        }

        #resetButton {
            width: 100%;
            padding: 10px;
            font-size: 1em;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #resetButton:hover {
            background-color: #c82333;
        }
    </style>

    <!-- Three.js (r110, 글로벌 THREE) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r110/three.min.js"></script>
    <!-- Cannon.js (0.6.2, 글로벌 CANNON) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>

<body>

    <!-- 왼쪽: 3D 캔버스 + 하단 컨트롤 -->
    <div id="main-content">
        <div id="container"></div>

        <div id="controls">
            <div>
                <button id="throwButton">던지기</button>
                <button id="throw100Button">100번 던지기</button>
                <div style="display: inline-block; margin-left: 10px; vertical-align: middle;">
                    <label for="speedRange" style="font-size: 0.9em; margin-right: 5px;">속도:</label>
                    <input type="range" id="speedRange" min="1" max="20" value="1" step="1"
                        style="vertical-align: middle;">
                    <span id="speedValue" style="font-size: 0.9em; width: 30px; display: inline-block;">1x</span>
                </div>
                <span id="resultDisplay">결과: -</span>
            </div>
        </div>
    </div>

    <!-- 오른쪽: 결과 패널 -->
    <div id="results-panel">
        <h2>기록창</h2>
        <div id="history-log">
            <table id="history-table">
                <thead>
                    <tr>
                        <th>회차</th>
                        <th>나온 눈</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 결과 행이 동적으로 추가됨 -->
                </tbody>
            </table>
        </div>

        <h2>전체 결과</h2>
        <div id="summary-table">
            <table id="summary-table-data">
                <thead>
                    <tr>
                        <th>눈</th>
                        <th>횟수</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 누적 빈도 행이 동적으로 추가됨 -->
                </tbody>
                <tfoot>
                    <tr>
                        <th>계</th>
                        <td id="summary-total-count">0번</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div id="reset-controls">
            <button id="resetButton">결과 초기화</button>
        </div>
    </div>

    <script>
        // -----------------------------
        // 전역 변수
        // -----------------------------
        let scene, camera, renderer, world;
        let dieBody, dieMesh;
        let groundBody, groundMesh;
        let dieMaterial;
        let animationFrameId;
        let isThrowing = false;        // 단일 던지기 중인지
        let isAutoThrowing = false;    // 100번 자동 던지기 중인지
        let resolveThrow = null;       // 던지기 완료 Promise resolve 함수
        let simulationSpeed = 1;       // 시뮬레이션 속도 배수
        let stableStepsCounter = 0;    // 안정화 스텝 카운터
        let throwCount = 0;           // 전체 던진 횟수

        // 각 눈의 누적 빈도
        const frequency = { 1: 0, 2: 0, 3: 0, 4: 0 };

        // UI 요소
        const container = document.getElementById('container');
        const throwButton = document.getElementById('throwButton');
        const throw100Button = document.getElementById('throw100Button');
        const speedRange = document.getElementById('speedRange');
        const speedValue = document.getElementById('speedValue');
        const resultDisplay = document.getElementById('resultDisplay');
        const historyLogEl = document.getElementById('history-log');
        const resetButton = document.getElementById('resetButton');

        // -----------------------------
        // 숫자 텍스처 생성 (주사위 면용)
        // -----------------------------
        function createNumberTexture(numberString, color) {
            const canvas = document.createElement('canvas');
            const size = 128;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // 배경색
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, size, size);

            // 무게중심 위치에 밝은 원 (숫자 배경)
            const centroidY = size * (2 / 3);
            ctx.beginPath();
            ctx.arc(size / 2, centroidY, 23, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fill();

            // 숫자
            ctx.font = 'Bold 22px Arial';
            ctx.fillStyle = '#000000';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(numberString, size / 2, centroidY);

            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        // -----------------------------
        // 책상(나무결) 바닥 텍스처 생성
        // -----------------------------
        function createDeskTexture() {
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // 기본 나무색
            ctx.fillStyle = '#c89f7a';
            ctx.fillRect(0, 0, size, size);

            // 가로 나무결 줄무늬
            for (let y = 0; y < size; y += 16) {
                const alpha = 0.12 + 0.08 * Math.sin(y * 0.15);
                ctx.fillStyle = `rgba(120, 72, 40, ${alpha})`;
                ctx.fillRect(0, y, size, 8);
            }

            // 얼룩/노이즈 추가
            const noiseCount = 600;
            for (let i = 0; i < noiseCount; i++) {
                const x = Math.random() * size;
                const y = Math.random() * size;
                const r = 1 + Math.random() * 2;
                ctx.fillStyle = 'rgba(90, 50, 30, 0.15)';
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(4, 4); // 더 촘촘한 나무결
            texture.needsUpdate = true;
            return texture;
        }

        // -----------------------------
        // 초기화
        // -----------------------------
        function init() {
            // 1. 물리 엔진
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);
            world.broadphase = new CANNON.NaiveBroadphase();

            dieMaterial = new CANNON.Material('dieMaterial');
            const groundMaterial = new CANNON.Material('groundMaterial');
            const contactMaterial = new CANNON.ContactMaterial(groundMaterial, dieMaterial, {
                friction: 0.1,
                restitution: 0.4
            });
            world.addContactMaterial(contactMaterial);

            // 2. Three.js 씬
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xeeeeff);

            const aspect = container.clientWidth / container.clientHeight;
            camera = new THREE.PerspectiveCamera(60, aspect, 0.1, 1000);
            camera.position.set(0, 7, 7);
            camera.lookAt(0, 0, 0);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 조명
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(5, 10, 7.5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            scene.add(directionalLight);

            // 3. 바닥 (책상 느낌)
            const groundGeometry = new THREE.PlaneGeometry(30, 30);
            const deskTexture = createDeskTexture();
            const groundMat = new THREE.MeshStandardMaterial({
                map: deskTexture,
                roughness: 0.7,
                metalness: 0.05
            });
            groundMesh = new THREE.Mesh(groundGeometry, groundMat);
            groundMesh.rotation.x = -Math.PI / 2;
            groundMesh.receiveShadow = true;
            scene.add(groundMesh);

            // 물리 바닥
            const groundShape = new CANNON.Plane();
            groundBody = new CANNON.Body({
                mass: 0,
                material: groundMaterial
            });
            groundBody.addShape(groundShape);
            groundBody.quaternion.setFromAxisAngle(
                new CANNON.Vec3(1, 0, 0),
                -Math.PI / 2
            );
            world.addBody(groundBody);

            // 4. 정사면체 주사위 생성
            createTetrahedronDie();

            // 5. 벽 생성 (화면 밖 탈출 방지)
            createContainmentWalls(groundMaterial);

            // 6. 이벤트
            throwButton.addEventListener('click', () => throwDie());
            throw100Button.addEventListener('click', handleThrow100);
            resetButton.addEventListener('click', resetResults);
            speedRange.addEventListener('input', (e) => {
                simulationSpeed = parseInt(e.target.value);
                speedValue.textContent = simulationSpeed + 'x';
            });
            window.addEventListener('resize', onWindowResize);

            // 7. 애니메이션 루프 시작
            animate();

            // 8. 누적 빈도 테이블 초기화
            updateSummaryTable();

            // 9. 초기 사이즈 강제 설정 (모바일 대응)
            onWindowResize();
        }

        // -----------------------------
        // 정사면체 주사위 생성
        // -----------------------------
        function createTetrahedronDie() {
            const radius = 1;
            const geometry = new THREE.TetrahedronGeometry(radius);

            const materials = [
                new THREE.MeshStandardMaterial({ map: createNumberTexture('1', '#ff0000'), roughness: 0.5 }),
                new THREE.MeshStandardMaterial({ map: createNumberTexture('2', '#00ff00'), roughness: 0.5 }),
                new THREE.MeshStandardMaterial({ map: createNumberTexture('3', '#0000ff'), roughness: 0.5 }),
                new THREE.MeshStandardMaterial({ map: createNumberTexture('4', '#ffff00'), roughness: 0.5 })
            ];

            dieMesh = new THREE.Mesh(geometry, materials);
            dieMesh.castShadow = true;
            dieMesh.position.y = 3;
            scene.add(dieMesh);

            // faceNormals 저장
            const faceNormals = [];
            for (let i = 0; i < geometry.faces.length; i++) {
                const face = geometry.faces[i];
                face.materialIndex = i;
                faceNormals.push({
                    normal: face.normal.clone(),
                    value: i + 1
                });
            }
            dieMesh.userData.faceNormals = faceNormals;

            // UV 맵 수동 설정 (r110 Geometry)
            const uvCoords = [
                new THREE.Vector2(0, 0),
                new THREE.Vector2(1, 0),
                new THREE.Vector2(0.5, 1)
            ];
            if (!geometry.faceVertexUvs[0] || geometry.faceVertexUvs[0].length === 0) {
                geometry.faceVertexUvs[0] = [];
                for (let i = 0; i < geometry.faces.length; i++) {
                    geometry.faceVertexUvs[0].push([]);
                }
            }
            for (let i = 0; i < geometry.faces.length; i++) {
                geometry.faceVertexUvs[0][i] = [uvCoords[0], uvCoords[1], uvCoords[2]];
            }
            geometry.uvsNeedUpdate = true;

            // cannon.js ConvexPolyhedron
            const cannonVertices = [];
            for (const v of geometry.vertices) {
                cannonVertices.push(new CANNON.Vec3(v.x, v.y, v.z));
            }
            const cannonFaces = [];
            for (const f of geometry.faces) {
                cannonFaces.push([f.a, f.b, f.c]);
            }

            const dieShape = new CANNON.ConvexPolyhedron(cannonVertices, cannonFaces);

            dieBody = new CANNON.Body({
                mass: 1,
                material: dieMaterial,
                shape: dieShape
            });
            dieBody.position.copy(dieMesh.position);
            dieBody.allowSleep = true;
            dieBody.sleepSpeedLimit = 0.5;
            dieBody.sleepTimeLimit = 1.0;
            world.addBody(dieBody);
        }

        // -----------------------------
        // 보이지 않는 벽 생성
        // -----------------------------
        function createContainmentWalls(wallMaterial) {
            const wallDistance = 10;
            const wallShape = new CANNON.Plane();

            const leftWallBody = new CANNON.Body({ mass: 0, material: wallMaterial, shape: wallShape });
            leftWallBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), Math.PI / 2);
            leftWallBody.position.set(-wallDistance, 0, 0);
            world.addBody(leftWallBody);

            const rightWallBody = new CANNON.Body({ mass: 0, material: wallMaterial, shape: wallShape });
            rightWallBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), -Math.PI / 2);
            rightWallBody.position.set(wallDistance, 0, 0);
            world.addBody(rightWallBody);

            const backWallBody = new CANNON.Body({ mass: 0, material: wallMaterial, shape: wallShape });
            backWallBody.position.set(0, 0, -wallDistance);
            world.addBody(backWallBody);

            const frontWallBody = new CANNON.Body({ mass: 0, material: wallMaterial, shape: wallShape });
            frontWallBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), Math.PI);
            frontWallBody.position.set(0, 0, wallDistance);
            world.addBody(frontWallBody);
        }

        // -----------------------------
        // 단일 던지기 (Promise 반환)
        // -----------------------------
        function throwDie() {
            if (isThrowing) return Promise.resolve();

            return new Promise((resolve) => {
                isThrowing = true;
                resolveThrow = resolve;
                stableStepsCounter = 0;

                // 자동 던지기 중이 아닐 때만 버튼 비활성화
                if (!isAutoThrowing) {
                    throwButton.disabled = true;
                    throw100Button.disabled = true;
                    resultDisplay.textContent = "결과: 굴러가는 중...";
                }

                dieBody.wakeUp();

                dieBody.position.set(
                    (Math.random() - 0.5) * 2,
                    5,
                    (Math.random() - 0.5) * 2
                );
                dieBody.quaternion.setFromEuler(
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2
                );

                dieBody.velocity.set(
                    (Math.random() - 0.5) * 5,
                    Math.random() * 3 + 2,
                    (Math.random() - 0.5) * 5
                );
                dieBody.angularVelocity.set(
                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 10
                );
            });
        }

        // -----------------------------
        // 100번 던지기 (순차 실행)
        // -----------------------------
        async function handleThrow100() {
            if (isThrowing || isAutoThrowing) return;

            isAutoThrowing = true;
            throwButton.disabled = true;
            throw100Button.disabled = true;

            // 100번 반복
            for (let i = 1; i <= 100; i++) {
                resultDisplay.textContent = `진행 중: ${i} / 100 회`;
                await throwDie();
            }

            resultDisplay.textContent = "100회 던지기 완료";
            isAutoThrowing = false;
            throwButton.disabled = false;
            throw100Button.disabled = false;
        }

        // -----------------------------
        // 애니메이션 루프
        // -----------------------------
        function animate() {
            animationFrameId = requestAnimationFrame(animate);

            if (world) {
                // 던지기 중일 때만 물리 시뮬레이션
                if (isThrowing) {
                    // 속도 배수만큼 물리 스텝 반복
                    for (let i = 0; i < simulationSpeed; i++) {
                        world.step(1 / 60);

                        const linearSpeed = dieBody.velocity.norm();
                        const angularSpeed = dieBody.angularVelocity.norm();
                        const STOP_THRESHOLD = 0.1;
                        const REQUIRED_STABLE_STEPS = 60; // 약 1초(60프레임) 동안 안정 유지

                        if (linearSpeed < STOP_THRESHOLD && angularSpeed < STOP_THRESHOLD) {
                            stableStepsCounter++;
                        } else {
                            stableStepsCounter = 0;
                        }

                        if (stableStepsCounter >= REQUIRED_STABLE_STEPS) {
                            stopDie();
                            break; // 멈췄으면 루프 탈출
                        }
                    }

                    if (dieBody && dieMesh) {
                        dieMesh.position.copy(dieBody.position);
                        dieMesh.quaternion.copy(dieBody.quaternion);
                    }
                }
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        // -----------------------------
        // 멈췄을 때 처리
        // -----------------------------
        function stopDie() {
            isThrowing = false;
            stableStepsCounter = 0;

            // 자동 던지기가 아닐 때만 버튼 활성화
            if (!isAutoThrowing) {
                throwButton.disabled = false;
                throw100Button.disabled = false;
            }

            dieBody.angularVelocity.set(0, 0, 0);

            const result = getDieResult();
            resultDisplay.textContent = `결과: ${result}`;

            throwCount++;
            frequency[result]++;
            updateSummaryTable();
            updateHistoryLog(result);

            // Promise resolve
            if (resolveThrow) {
                resolveThrow();
                resolveThrow = null;
            }
        }

        // -----------------------------
        // 카메라 기준 가장 잘 보이는 면 판정
        // -----------------------------
        function getDieResult() {
            const viewVector = new THREE.Vector3();
            viewVector.subVectors(camera.position, dieMesh.position).normalize();

            let maxDot = -Infinity;
            let resultValue = -1;

            if (!dieMesh || !dieMesh.userData.faceNormals) {
                console.error("Die mesh or face normals not initialized.");
                return 0;
            }

            const faceNormals = dieMesh.userData.faceNormals;
            for (const face of faceNormals) {
                const worldNormal = face.normal.clone();
                worldNormal.applyQuaternion(dieMesh.quaternion);

                const dot = worldNormal.dot(viewVector);
                if (dot > maxDot) {
                    maxDot = dot;
                    resultValue = face.value;
                }
            }
            return resultValue;
        }

        // -----------------------------
        // 결과 기록 테이블 갱신
        // -----------------------------
        function updateHistoryLog(result) {
            const tableBody = document
                .getElementById('history-table')
                .getElementsByTagName('tbody')[0];

            const newRow = tableBody.insertRow();
            const cellCount = newRow.insertCell(0);
            const cellResult = newRow.insertCell(1);

            cellCount.textContent = `${throwCount}회차`;
            cellResult.textContent = result;

            // 새로운 행이 보이도록 스크롤
            newRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // -----------------------------
        // 누적 빈도 테이블 갱신
        // -----------------------------
        function updateSummaryTable() {
            const summaryTBody = document
                .getElementById('summary-table-data')
                .getElementsByTagName('tbody')[0];
            summaryTBody.innerHTML = '';

            for (let i = 1; i <= 4; i++) {
                const row = summaryTBody.insertRow();
                const cellNum = row.insertCell(0);
                const cellCount = row.insertCell(1);

                cellNum.textContent = i;
                cellCount.textContent = `${frequency[i]}번`;
            }

            const totalCountFootEl = document.getElementById('summary-total-count');
            totalCountFootEl.textContent = `${throwCount}번`;
        }

        // -----------------------------
        // 결과 초기화
        // -----------------------------
        function resetResults() {
            throwCount = 0;
            frequency[1] = frequency[2] = frequency[3] = frequency[4] = 0;

            const historyTBody = document
                .getElementById('history-table')
                .getElementsByTagName('tbody')[0];
            historyTBody.innerHTML = '';

            updateSummaryTable();

            resultDisplay.textContent = "결과: -";

            isThrowing = false;
            isAutoThrowing = false;
            resolveThrow = null;

            throwButton.disabled = false;
            throw100Button.disabled = false;
            stableStepsCounter = 0;

            resetDiePosition();
        }

        // -----------------------------
        // 주사위 위치만 리셋
        // -----------------------------
        function resetDiePosition() {
            if (dieBody) {
                dieBody.wakeUp();
                dieBody.velocity.set(0, 0, 0);
                dieBody.angularVelocity.set(0, 0, 0);
                dieBody.position.set(0, 3, 0);
                dieBody.quaternion.setFromEuler(0, 0, 0);
                dieBody.sleep();

                if (dieMesh) {
                    dieMesh.position.copy(dieBody.position);
                    dieMesh.quaternion.copy(dieBody.quaternion);
                }
            }
        }

        // -----------------------------
        // 창 크기 변경 대응
        // -----------------------------
        function onWindowResize() {
            const width = container.clientWidth;
            const height = container.clientHeight;

            if (camera) {
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
            }
            if (renderer) {
                renderer.setSize(width, height);
            }
        }

        // 페이지 로드 후 초기화
        window.onload = init;
    </script>
</body>

</html>
