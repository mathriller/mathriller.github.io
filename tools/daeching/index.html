<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>선대칭 탐구 (Symmetry Explorer)</title>
  <script type="module" crossorigin src="./assets/index-B3276BDo.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DP88nPcX.css">
</head>

<body>
  <div id="app">
    <div id="feedback-overlay"></div>
    <canvas id="main-canvas"></canvas>
    <div id="ui-layer">
      <div id="debug-log"
        style="position: absolute; top: 10px; left: 10px; width: 300px; height: 200px; overflow: hidden; pointer-events: none; color: rgba(0,0,0,0.5); font-size: 10px; z-index: 9999;">
      </div>

      <!-- SVG for the axis line -->
      <svg id="axis-layer"
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2;">
        <line id="axis-line-svg-path" x1="0" y1="0" x2="0" y2="0" stroke="#2196F3" stroke-width="4"
          stroke-dasharray="10, 5" />
      </svg>

      <!-- Handles -->
      <div id="handle-1" class="axis-handle-dot"></div>
      <div id="handle-2" class="axis-handle-dot"></div>

      <!-- Ghost Points (Cursors) -->
      <div id="ghost-1" class="ghost-point"></div>
      <div id="ghost-2" class="ghost-point"></div>

      <button id="grid-btn">Grid</button>
      <button id="reset-btn">지우기</button>
    </div>
  </div>
</body>

</html>
