<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polynomial Graphic Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Polynomial Grapher</h1>
            <p>다항함수 식을 입력하여 그래프를 확인하세요.</p>
        </header>
        
        <main>
            <div class="input-section">
                <div class="input-group">
                    <label for="functionInput">f(x) = </label>
                    <input type="text" id="functionInput" placeholder="예: x^2 - 2x + 1" autocomplete="off">
                    <button id="drawBtn">Draw</button>
                </div>
                <div class="controls">
                    <button id="resetBtn" class="secondary-btn">Reset View</button>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="graphCanvas"></canvas>
            </div>
        </main>

        <footer>
            <p>Powered by Vanilla JS & Canvas API</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
