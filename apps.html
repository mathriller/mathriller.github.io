<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수업용 앱 · 최인용</title>
  <meta name="description" content="수학 수업에서 바로 쓸 수 있는 웹 앱 모음">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-head">
    <div class="wrap">
      <a class="brand" href="./"><b>최인용</b><span>서울교육대학교 수학교육과</span></a>
      <nav class="nav">
        <a href="./">소개</a>
        <a href="apps.html" aria-current="page">수업용 앱</a>
        <a href="research.html">연구</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-head">
      <div class="wrap">
        <span class="eyebrow">Mathriller</span>
        <h1>수업용 앱</h1>
        <p>데이터 분석부터 동적 기하까지, 수학 수업에서 바로 열어 쓸 수 있도록 만든 탐구 도구입니다. 설치나 로그인 없이 브라우저에서 실행됩니다.</p>
      </div>
    </div>

    <div class="wrap">
      <div class="apps-toolbar">
        <div class="row"><span class="label">영역</span><div class="chips" id="f-area"></div></div>
        <div class="row" id="f-grade-row"><span class="label">대상</span><div class="chips" id="f-grade"></div></div>
      </div>
      <div class="apps-grid" id="apps" data-adm-add-app></div>
    </div>
  </main>

  <footer class="site-foot" id="site-foot"></footer>

  <script src="assets/js/common.js"></script>
  <script>
  const state = { area: "", grade: "" };
  // 대상은 "초등 3–4학년" → "초등"처럼 학교급으로 묶는다
  const level = (g) => (String(g || "").match(/^(초등|중등|중학|고등|고교|교사|예비교사|대학)/) || [""])[0].replace("중학", "중등").replace("고교", "고등");

  function chips(el, apps, list, key) {
    const count = (fn) => apps.filter(fn).length;
    el.innerHTML = [`<button class="chip" data-v="">전체<span class="n">${apps.length}</span></button>`,
      ...list.map((v) => `<button class="chip" data-v="${esc(v)}">${esc(v)}<span class="n">${count((a) => (key === "area" ? a.area : level(a.grade)) === v)}</span></button>`)].join("");
    el.onclick = (e) => { const b = e.target.closest(".chip"); if (b) { state[key] = b.dataset.v; draw(); } };
  }

  let apps = [];
  function draw() {
    $$("#f-area .chip").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.area));
    $$("#f-grade .chip").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.grade));
    const list = apps.filter((a) => (!state.area || a.area === state.area) && (!state.grade || level(a.grade) === state.grade));
    $("#apps").innerHTML = list.length ? list.map(appCard).join("") : (adminOn() ? "" : `<div class="empty" style="grid-column:1/-1">해당하는 앱이 없습니다.</div>`);
    window.Admin?.decorate();
  }

  window.PAGE = {
    async render() {
      apps = visible((await loadJSON("apps")).items);
      const areas = [...AREAS, ...new Set(apps.map((a) => a.area).filter((x) => x && !AREAS.includes(x)))].filter((x) => apps.some((a) => a.area === x));
      const grades = [...new Set(apps.map((a) => level(a.grade)).filter(Boolean))];
      chips($("#f-area"), apps, areas, "area");
      $("#f-grade-row").hidden = grades.length < 2;
      if (grades.length > 1) chips($("#f-grade"), apps, grades, "grade");
      draw();
    },
  };
  PAGE.render();
  </script>
</body>
</html>
